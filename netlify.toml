# ============================================================
# netlify.toml — FASE 3B
# Deploy folder ini ke Netlify. Fungsi pembayaran otomatis
# tersedia di:
#   /.netlify/functions/create-payment
#   /.netlify/functions/payment-webhook
# ------------------------------------------------------------
# Set env di Netlify > Site settings > Environment variables:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   PAYMENT_PROVIDER = midtrans | xendit
#   MIDTRANS_SERVER_KEY, MIDTRANS_IS_PRODUCTION
#   XENDIT_SECRET_KEY, XENDIT_CALLBACK_TOKEN
#   PUBLIC_BASE_URL = https://undanganku.com
# ============================================================
[build]
  publish = "."
  functions = "netlify/functions"

# Alias pendek untuk endpoint fungsi (opsional)
[[redirects]]
  from = "/api/pay"
  to = "/.netlify/functions/create-payment"
  status = 200
[[redirects]]
  from = "/api/webhook"
  to = "/.netlify/functions/payment-webhook"
  status = 200
[[redirects]]
  from = "/api/payment-status"
  to = "/.netlify/functions/payment-status"
  status = 200

# Wildcard subdomain -> index.html (router style Fase 3A membaca subdomain sbg slug)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = []}

# ------------------------------------------------------------
# FASE 4 (Tahap 2): fungsi TERJADWAL untuk masa aktif undangan.
#   - Auto-expire undangan yang sudah lewat masa aktif.
#   - Kirim pengingat perpanjangan (<= 7 hari sebelum berakhir).
# Butuh env: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (opsional EXPIRY_REMIND_DAYS).
# ------------------------------------------------------------
[functions."expiry-cron"]
  schedule = "@daily"


# PERFORMANCE CACHE HEADERS
# HTML/config selalu divalidasi ulang; aset media dan font dapat disimpan lama.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/db-config.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"


# SECURITY HEADERS — FASE 1
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co https://api.xendit.co https://app.midtrans.com https://app.sandbox.midtrans.com; frame-src 'self' https://www.google.com https://app.midtrans.com https://app.sandbox.midtrans.com https://checkout.xendit.co"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
